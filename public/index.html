<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader - SoundCloud & TikTok</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" alt="Profile" class="profile-pic">
                <span class="badge">PRO</span>
            </div>
            <h1>MEDIA DOWNLOADER</h1>
            <p class="subtitle">Enterprise High-Speed Media Downloader</p>
            <div class="stats">
                <i class="fa-solid fa-fire"></i> Total Unduhan: <span id="total-downloads">1256</span>
            </div>
        </header>

        <main>
            <div class="card">
                <div class="platform-tabs">
                    <button class="tab-btn active" data-platform="soundcloud">
                        <i class="fa-brands fa-soundcloud"></i> SoundCloud
                    </button>
                    <button class="tab-btn" data-platform="tiktok">
                        <i class="fa-brands fa-tiktok"></i> TikTok
                    </button>
                </div>

                <div class="input-group">
                    <label id="input-label" for="url-input">Tempel Link SOUNDCLOUD:</label>
                    <div class="input-wrapper">
                        <input type="text" id="url-input" placeholder="https://soundcloud.com/...">
                        <button id="paste-btn"><i class="fa-solid fa-paste"></i> Paste</button>
                    </div>
                </div>

                <div class="input-group" id="format-group">
                    <label for="format-select"><i class="fa-solid fa-sliders"></i> Format Output:</label>
                    <select id="format-select" class="format-select">
                        <option value="audio">Audio (MP3)</option>
                        <option value="video">Video (Tanpa Watermark)</option>
                    </select>
                </div>

                <button id="download-btn" class="action-btn">
                    <i class="fa-solid fa-rocket"></i> Unduh Sekarang
                </button>

                <div id="status-box" class="status-box hidden">
                    <div class="loader-spinner"></div>
                    <p id="status-text">Memproses...</p>
                    <div class="progress-bar-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="download-info" id="download-info">
                        <p>Kecepatan: <span id="speed">0.00</span> MB/s</p>
                        <p>ETA: <span id="eta">0s</span></p>
                    </div>
                </div>

                <div id="preview-box" class="preview-box hidden">
                    <div class="preview-content">
                        <img id="preview-img" src="" alt="Thumbnail">
                        <div class="preview-details">
                            <span class="preview-title-label">JUDUL MEDIA:</span>
                            <h4 id="preview-title">-</h4>
                        </div>
                    </div>
                    <a id="download-link-btn" href="#" class="save-btn" download>
                        <i class="fa-solid fa-download"></i> Simpan ke Perangkat
                    </a>
                </div>
            </div>

            <div class="footer-info-card">
                <div class="footer-info-item">
                    <i class="fa-solid fa-shield-halved"></i> 100% Aman & Tanpa Iklan
                </div>
                <div class="footer-info-tip">
                    <i class="fa-solid fa-lightbulb"></i> <strong>Tips:</strong> Cukup tempel link, sistem otomatis mendeteksi platform dan menampilkan preview secara instan.
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
