<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud Downloader Pro</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5500">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-zinc-900/80 backdrop-blur-md border border-zinc-800 p-6 rounded-2xl shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-orange-500/10 rounded-full mb-2">
                <svg class="w-8 h-8 text-orange-500" fill="currentColor" viewBox="0 0 24 24"><path d="M11.5 6C8.46 6 6 8.46 6 11.5c0 .34.04.67.11 1H5a2 2 0 00-2 2v3a2 2 0 002 2h1v-4a4 4 0 018 0v4h1a2 2 0 002-2v-3a2 2 0 00-2-2h-1.11c.07-.33.11-.66.11-1C17 8.46 14.54 6 11.5 6z"/></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">SoundCloud Downloader</h1>
            <p class="text-xs text-zinc-400 mt-1">Unduh lagu favoritmu secara praktis & gratis</p>
            
            <!-- Live Counter Badge -->
            <div class="mt-3 inline-flex items-center gap-1.5 px-3 py-1 bg-zinc-800/60 border border-zinc-700/50 rounded-full text-xs text-orange-400">
                <span class="w-2 h-2 rounded-full bg-orange-500 animate-ping"></span>
                <span id="counter-text">Total Unduhan: Memuat...</span>
            </div>
        </div>

        <!-- Form Input -->
        <div class="space-y-4">
            <input type="text" id="urlInput" placeholder="Tempel link SoundCloud di sini..." 
                class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl focus:outline-none focus:border-orange-500 text-sm transition">
            
            <button id="downloadBtn" onclick="startDownload()" 
                class="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 font-semibold rounded-xl transition shadow-lg shadow-orange-500/20 cursor-pointer">
                🚀 Unduh Sekarang
            </button>
        </div>

        <!-- SKELETON LOADING (Hidden secara default) -->
        <div id="skeletonLoader" class="hidden mt-6 space-y-3 p-4 bg-zinc-950/50 rounded-xl border border-zinc-800/80">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg skeleton"></div>
                <div class="flex-1 space-y-2">
                    <div class="h-4 rounded skeleton w-3/4"></div>
                    <div class="h-3 rounded skeleton w-1/2"></div>
                </div>
            </div>
            <div class="h-2 rounded-full skeleton w-full mt-4"></div>
        </div>

        <!-- Progress Section -->
        <div id="progressSection" class="hidden mt-6 space-y-3 p-4 bg-zinc-950 rounded-xl border border-zinc-800">
            <div class="flex justify-between text-xs text-zinc-400">
                <span id="statusText" class="truncate max-w-[200px]">Memproses...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-orange-500 h-full w-0 transition-all duration-200"></div>
            </div>
            <div class="flex justify-between text-[11px] text-zinc-500 font-mono">
                <span id="speedText">0.00 MB/s</span>
                <span id="etaText">0s tersisa</span>
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden mt-6 text-center">
            <a id="downloadLink" href="#" class="inline-block w-full py-3 bg-emerald-600 hover:bg-emerald-700 font-semibold rounded-xl transition shadow-lg shadow-emerald-600/20">
                📥 Simpan File ke Perangkat
            </a>
        </div>

        <div id="errorText" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center rounded-xl"></div>
    </div>

    <footer class="mt-8 text-xs text-zinc-600 text-center">
        Created with ❤️ by <span class="text-zinc-400">@FACHRI_HDYT</span>
    </footer>

    <!-- Client Script -->
    <script>
        const socket = io();

        // Ambil Live Counter awal via REST API
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                document.getElementById('counter-text').innerText = `Total Unduhan: ${data.totalDownloads.toLocaleString()}`;
            });

            // Update Live Counter secara realtime via Socket.io
        socket.on('update_counter', (data) => {
            document.getElementById('counter-text').innerText = `Total Unduhan: ${data.totalDownloads.toLocaleString()}`;
        });

        function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('Masukkan link SoundCloud terlebih dahulu!');

            // Reset UI
            document.getElementById('errorText').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            
            // Tampilkan Skeleton Loading
            document.getElementById('skeletonLoader').classList.remove('hidden');
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('downloadBtn').classList.add('opacity-50', 'cursor-not-allowed');

            socket.emit('start_download', url);
        }

        socket.on('info', (msg) => {
            // Sembunyikan skeleton dan tampilkan progress bar biasa saat info masuk
            document.getElementById('skeletonLoader').classList.add('hidden');
            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('statusText').innerText = msg;
        });

        socket.on('progress', (data) => {
            document.getElementById('skeletonLoader').classList.add('hidden');
            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('statusText').innerText = data.title;
            document.getElementById('progressPercent').innerText = `${data.progress}%`;
            document.getElementById('progressBar').style.width = `${data.progress}%`;
            document.getElementById('speedText').innerText = `${data.speedMBps} MB/s`;
            document.getElementById('etaText').innerText = `${data.etaSec}s tersisa`;
        });

        socket.on('done', (data) => {
            document.getElementById('skeletonLoader').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            
            const dlLink = document.getElementById('downloadLink');
            dlLink.href = data.downloadUrl;
            dlLink.setAttribute('download', data.fileName);

            const btn = document.getElementById('downloadBtn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.innerText = '✨ Unduh Lagi';
        });

        socket.on('error', (err) => {
            document.getElementById('skeletonLoader').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            const errDiv = document.getElementById('errorText');
            errDiv.innerText = err;
            errDiv.classList.remove('hidden');

            const btn = document.getElementById('downloadBtn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        // Register Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>
</html>
