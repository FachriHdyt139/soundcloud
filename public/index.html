<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader Pro - By @FACHRI_HDYT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .anime-float {
            animation: floatAnime 4s ease-in-out infinite;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4">

    <!-- Header / Anime Mascot Section -->
    <div class="text-center mt-4">
        <div class="relative inline-block anime-float">
            <!-- Gambar Anime Bergerak yang Stabil & Pasti Muncul -->
<img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2bzJpYW5oajVvZGR5dGNha3JjZ2VvNnd4Y2R4OG9nb2EwbzBwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lq0h93752f6J9tijrh/giphy.gif" alt="Anime Mascot" class="w-28 h-28 object-cover rounded-full border-4 border-pink-500 shadow-lg shadow-pink-500/50 mx-auto">
            <span class="absolute bottom-0 right-0 bg-pink-600 text-xs px-2 py-0.5 rounded-full font-bold animate-pulse">LIVE</span>
        </div>
        <h1 class="text-2xl font-black mt-2 tracking-wider bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">MEDIA DOWNLOADER</h1>
        <p class="text-xs text-slate-400">Unduh Musik & Video Favoritmu Praktis & Gratis</p>
        <div class="inline-block bg-slate-800/80 border border-slate-700 px-3 py-1 rounded-full text-xs mt-2 text-yellow-400 font-semibold shadow">
            🔥 Total Unduhan: <span id="total-downloads">1241</span>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-md border border-slate-800 p-5 rounded-2xl shadow-2xl my-4">
        
        <!-- PLATFORM SELECTION TABS (Tombol Pilihan di Atas) -->
        <div class="grid grid-cols-2 gap-2 bg-slate-800 p-1.5 rounded-xl mb-5">
            <button id="tab-soundcloud" onclick="switchPlatform('soundcloud')" class="py-2.5 rounded-lg text-sm font-bold transition-all duration-300 bg-gradient-to-r from-orange-500 to-amber-600 text-white shadow-md">
                <i class="fa-brands fa-soundcloud mr-1.5"></i> SoundCloud
            </button>
            <button id="tab-tiktok" onclick="switchPlatform('tiktok')" class="py-2.5 rounded-lg text-sm font-bold transition-all duration-300 text-slate-400 hover:text-white">
                <i class="fa-brands fa-tiktok mr-1.5"></i> TikTok
            </button>
        </div>

        <!-- INPUT FORM -->
        <div class="space-y-3">
            <div>
                <label id="input-label" class="block text-xs font-semibold text-slate-400 mb-1">Tempel Link SoundCloud:</label>
                <input type="text" id="url-input" placeholder="https://soundcloud.com/..." class="w-full bg-slate-950 border border-slate-700 focus:border-pink-500 rounded-xl px-4 py-3 text-sm text-white outline-none transition">
            </div>

            <button onclick="startDownload()" id="download-btn" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-pink-500/30 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rocket"></i>
                <span id="btn-text">Unduh Sekarang</span>
            </button>
        </div>

        <!-- STATUS / LOG BOX -->
        <div id="status-box" class="mt-4 hidden bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs space-y-2">
            <div class="flex justify-between text-slate-400">
                <span id="status-title" class="truncate max-w-[200px] text-pink-400 font-semibold">Menghubungkan...</span>
                <span id="progress-text">0%</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-pink-500 to-purple-500 h-full w-0 transition-all duration-200"></div>
            </div>
            <div class="flex justify-between text-[10px] text-slate-500">
                <span id="speed-text">Kecepatan: 0.00 MB/s</span>
                <span id="eta-text">Estimasi: 0s</span>
            </div>
        </div>

        <!-- ERROR MESSAGE -->
        <div id="error-box" class="mt-4 hidden bg-red-950/50 border border-red-800/80 text-red-300 p-3 rounded-xl text-xs text-center"></div>

        <!-- RESULT DOWNLOAD LINK -->
        <div id="result-box" class="mt-4 hidden text-center">
            <a id="download-link" href="#" class="inline-block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                <i class="fa-solid fa-download mr-2"></i> Simpan ke Perangkat
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-xs text-slate-500 text-center mb-2">
        Created with <span class="text-pink-500">❤️</span> by <span class="font-semibold text-slate-400">@FACHRI_HDYT</span>
    </footer>

    <script>
        const socket = io();
        let currentPlatform = 'soundcloud';

        function switchPlatform(platform) {
            currentPlatform = platform;
            const scBtn = document.getElementById('tab-soundcloud');
            const tkBtn = document.getElementById('tab-tiktok');
            const inputLabel = document.getElementById('input-label');
            const urlInput = document.getElementById('url-input');

            resetUI();

            if (platform === 'soundcloud') {
                scBtn.className = "py-2.5 rounded-lg text-sm font-bold transition-all duration-300 bg-gradient-to-r from-orange-500 to-amber-600 text-white shadow-md";
                tkBtn.className = "py-2.5 rounded-lg text-sm font-bold transition-all duration-300 text-slate-400 hover:text-white";
                inputLabel.innerText = "Tempel Link SoundCloud:";
                urlInput.placeholder = "https://soundcloud.com/..." ;
            } else {
                tkBtn.className = "py-2.5 rounded-lg text-sm font-bold transition-all duration-300 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md";
                scBtn.className = "py-2.5 rounded-lg text-sm font-bold transition-all duration-300 text-slate-400 hover:text-white";
                inputLabel.innerText = "Tempel Link TikTok (Contoh: vt.tiktok.com/...):";
                urlInput.placeholder = "https://vt.tiktok.com/...";
            }
        }

        function resetUI() {
            document.getElementById('status-box').classList.add('hidden');
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('progress-bar').style.width = '0%';
        }

        function startDownload() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) {
                showError("Link tidak boleh kosong!");
                return;
            }

            resetUI();
            document.getElementById('status-box').classList.remove('hidden');
            document.getElementById('download-btn').disabled = true;
            document.getElementById('btn-text').innerText = "Memproses...";

            socket.emit('start_download', { url, platform: currentPlatform });
        }

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            errBox.innerText = msg;
            errBox.classList.remove('hidden');
            document.getElementById('status-box').classList.add('hidden');
            document.getElementById('download-btn').disabled = false;
            document.getElementById('btn-text').innerText = "Unduh Sekarang";
        }

        socket.on('info', (msg) => {
            document.getElementById('status-title').innerText = msg;
        });

        socket.on('progress', (data) => {
            document.getElementById('progress-bar').style.width = `${data.progress}%`;
            document.getElementById('progress-text').innerText = `${data.progress}%`;
            document.getElementById('speed-text').innerText = `Kecepatan: ${data.speedMBps} MB/s`;
            document.getElementById('eta-text').innerText = `Estimasi: ${data.etaSec}s`;
            if(data.title) {
                document.getElementById('status-title').innerText = data.title;
            }
        });

        socket.on('done', (data) => {
            document.getElementById('status-box').classList.add('hidden');
            const resBox = document.getElementById('result-box');
            const link = document.getElementById('download-link');
            link.href = data.downloadUrl;
            link.download = data.fileName;
            resBox.classList.remove('hidden');
            document.getElementById('download-btn').disabled = false;
            document.getElementById('btn-text').innerText = "Unduh Sekarang";
        });

        socket.on('error', (errMsg) => {
            showError(errMsg);
        });

        socket.on('update_counter', (data) => {
            document.getElementById('total-downloads').innerText = data.totalDownloads;
        });
    </script>
</body>
</html>
