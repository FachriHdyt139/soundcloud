<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Media Downloader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .anime-float { animation: floatAnime 4s ease-in-out infinite; }
        .theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
        }
        .theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
            color: #0f172a;
        }
    </style>
</head>
<body id="body-theme" class="theme-dark flex flex-col items-center justify-between p-3 min-h-screen transition-colors duration-300">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-3 right-3 z-50 space-y-2"></div>

    <!-- Top Navigation Bar (Theme Switcher) -->
    <div class="w-full max-w-md flex justify-between items-center px-1">
        <span class="text-[10px] font-bold text-pink-500 uppercase tracking-widest">@FACHRI_HDYT Engine</span>
        <button onclick="toggleTheme()" class="bg-slate-800/80 hover:bg-slate-700 text-yellow-400 p-2 rounded-full text-xs shadow border border-slate-700 transition">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- Header / Mascot Section -->
    <div class="text-center mt-1">
        <div class="relative inline-block anime-float">
            <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2bzJpYW5oajVvZGR5dGNha3JjZ2VvNnd4Y2R4OG9nb2EwbzBwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lq0h93752f6J9tijrh/giphy.gif" alt="Mascot" class="w-20 h-20 object-cover rounded-full border-4 border-pink-500 shadow-lg mx-auto">
            <span class="absolute bottom-0 right-0 bg-pink-600 text-[9px] px-1.5 py-0.2 rounded-full font-bold text-white animate-pulse">PRO</span>
        </div>
        <h1 class="text-lg font-black mt-1 tracking-wider bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">MEDIA DOWNLOADER</h1>
        <div class="inline-block bg-slate-800/80 border border-slate-700 px-2.5 py-0.5 rounded-full text-[10px] mt-1 text-yellow-400 font-semibold shadow">
            🔥 Total Unduhan: <span id="total-downloads">1255</span>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div id="main-card" class="w-full max-w-md bg-slate-900/95 backdrop-blur-md border border-slate-800 p-4 rounded-2xl shadow-2xl my-2 text-slate-100">
        
        <!-- PLATFORM TABS (SoundCloud, TikTok, Instagram, YouTube) -->
        <div class="grid grid-cols-4 gap-1 bg-slate-800 p-1 rounded-xl mb-3 text-center">
            <button id="tab-soundcloud" onclick="switchPlatform('soundcloud')" class="py-1.5 rounded-lg text-[11px] font-bold transition bg-gradient-to-r from-orange-500 to-amber-600 text-white shadow">SC</button>
            <button id="tab-tiktok" onclick="switchPlatform('tiktok')" class="py-1.5 rounded-lg text-[11px] font-bold transition text-slate-400 hover:text-white">TikTok</button>
            <button id="tab-instagram" onclick="switchPlatform('instagram')" class="py-1.5 rounded-lg text-[11px] font-bold transition text-slate-400 hover:text-white">IG</button>
            <button id="tab-youtube" onclick="switchPlatform('youtube')" class="py-1.5 rounded-lg text-[11px] font-bold transition text-slate-400 hover:text-white">YT</button>
        </div>

        <!-- INPUT FORM & QUICK PASTE -->
        <div class="space-y-2.5">
            <div>
                <label id="input-label" class="block text-[11px] font-semibold text-slate-400 mb-1">Tempel Link SoundCloud:</label>
                <div class="relative flex items-center">
                    <input type="text" id="url-input" oninput="autoDetectPlatform(this.value)" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 focus:border-pink-500 rounded-xl pl-3 pr-14 py-2.5 text-xs text-white outline-none transition">
                    <button onclick="playPopSound(); pasteClipboard();" class="absolute right-1 bg-slate-800 hover:bg-slate-700 text-pink-400 px-2.5 py-1 rounded-lg text-[11px] font-bold transition border border-slate-700">
                        <i class="fa-solid fa-paste mr-1"></i>Paste
                    </button>
                </div>
            </div>

            <!-- FORMAT SELECTOR -->
            <div id="format-container" class="hidden flex items-center justify-between bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-[11px]">
                <span class="text-slate-400"><i class="fa-solid fa-sliders text-pink-400 mr-1"></i> Format Output:</span>
                <select id="format-select" class="bg-slate-900 text-white border border-slate-700 rounded-lg px-2 py-1 outline-none text-[11px]">
                    <option value="mp4">Video (MP4)</option>
                    <option value="mp3">Audio (MP3)</option>
                </select>
            </div>

            <button onclick="playPopSound(); startDownload();" id="download-btn" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-pink-500/30 flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-rocket"></i>
                <span id="btn-text">Unduh Sekarang</span>
            </button>
        </div>

        <!-- PREVIEW BOX -->
        <div id="preview-box" class="mt-3 hidden bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center space-x-3">
            <img id="preview-img" src="" alt="Thumbnail" class="w-12 h-12 object-cover rounded-lg border border-slate-700 shadow flex-shrink-0">
            <div class="overflow-hidden">
                <p class="text-[9px] text-pink-400 font-semibold uppercase tracking-wider">Judul Media:</p>
                <h3 id="preview-title" class="text-xs text-white font-bold truncate max-w-[210px]">Memuat judul...</h3>
            </div>
        </div>

        <!-- STATUS BOX DENGAN CIRCULAR PROGRESS -->
        <div id="status-box" class="mt-3 hidden bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs flex items-center space-x-4">
            <!-- Circular Progress Indicator -->
            <div class="relative w-12 h-12 flex items-center justify-center flex-shrink-0">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" class="text-slate-800 fill-none"></circle>
                    <circle id="circular-progress" cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" stroke-dasharray="125.6" stroke-dashoffset="125.6" class="text-pink-500 fill-none transition-all duration-200"></circle>
                </svg>
                <span id="progress-text" class="absolute text-[10px] font-bold text-white">0%</span>
            </div>
            <div class="overflow-hidden flex-grow space-y-1">
                <span id="status-title" class="block truncate text-pink-400 font-semibold text-[11px]">Menghubungkan...</span>
                <div class="flex justify-between text-[10px] text-slate-400">
                    <span id="speed-text">0.00 MB/s</span>
                    <span id="eta-text">ETA: 0s</span>
                </div>
            </div>
        </div>

        <!-- ERROR MESSAGE -->
        <div id="error-box" class="mt-3 hidden bg-red-950/50 border border-red-800/80 text-red-300 p-2.5 rounded-xl text-xs text-center"></div>

        <!-- RESULT DOWNLOAD LINK -->
        <div id="result-box" class="mt-3 hidden text-center">
            <a id="download-link" href="#" class="inline-block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-lg transition text-xs">
                <i class="fa-solid fa-download mr-2"></i> Simpan ke Perangkat
            </a>
        </div>
    </div>

    <!-- RIWAYAT UNDUHAN LOKAL (Local History) -->
    <div class="w-full max-w-md bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 mb-2">
        <div class="flex justify-between items-center font-bold text-pink-400 mb-1 border-b border-slate-800 pb-1">
            <span><i class="fa-solid fa-clock-rotate-left mr-1"></i> Riwayat Unduhan Lokal</span>
            <button onclick="clearHistory()" class="text-[9px] text-slate-500 hover:text-red-400">Hapus</button>
        </div>
        <div id="history-list" class="space-y-1 max-h-24 overflow-y-auto text-[11px] text-slate-400">
            <p class="text-center italic text-slate-600">Belum ada riwayat unduhan.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-[10px] text-slate-500 text-center mb-1">
        Created with <span class="text-pink-500">❤️</span> by <span class="font-semibold text-slate-400">@FACHRI_HDYT</span>
    </footer>

    <script>
        const socket = io();
        let currentPlatform = 'soundcloud';

        // 1. Web Audio API untuk Efek Suara Pop Interaktif
        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        // 2. Dark/Light Mode Switcher
        function toggleTheme() {
            playPopSound();
            const body = document.getElementById('body-theme');
            const card = document.getElementById('main-card');
            const icon = document.getElementById('theme-icon');
            if (body.classList.contains('theme-dark')) {
                body.className = 'theme-light flex flex-col items-center justify-between p-3 min-h-screen transition-colors duration-300';
                card.className = 'w-full max-w-md bg-white/95 backdrop-blur-md border border-slate-200 p-4 rounded-2xl shadow-2xl my-2 text-slate-800';
                icon.className = 'fa-solid fa-sun';
            } else {
                body.className = 'theme-dark flex flex-col items-center justify-between p-3 min-h-screen transition-colors duration-300';
                card.className = 'w-full max-w-md bg-slate-900/95 backdrop-blur-md border border-slate-800 p-4 rounded-2xl shadow-2xl my-2 text-slate-100';
                icon.className = 'fa-solid fa-moon';
            }
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${bgColor} text-white px-3 py-2 rounded-xl text-xs shadow-xl flex items-center space-x-2 transition-all duration-300 translate-y-[-20px] opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-[-20px]', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('url-input').value = text;
                autoDetectPlatform(text);
                showToast('Link berhasil ditempel!');
            } catch (err) {
                showToast('Gagal membaca clipboard.', 'error');
            }
        }

        function autoDetectPlatform(url) {
            if (url.includes('tiktok.com') || url.includes('vt.tiktok.com')) switchPlatform('tiktok', false);
            else if (url.includes('soundcloud.com') || url.includes('on.soundcloud.com')) switchPlatform('soundcloud', false);
            else if (url.includes('instagram.com')) switchPlatform('instagram', false);
            else if (url.includes('youtube.com') || url.includes('youtu.be')) switchPlatform('youtube', false);
        }

        function switchPlatform(platform, resetInput = true) {
            playPopSound();
            currentPlatform = platform;
            ['soundcloud', 'tiktok', 'instagram', 'youtube'].forEach(p => {
                const btn = document.getElementById(`tab-${p}`);
                btn.className = p === platform 
                    ? "py-1.5 rounded-lg text-[11px] font-bold transition bg-gradient-to-r from-orange-500 to-amber-600 text-white shadow"
                    : "py-1.5 rounded-lg text-[11px] font-bold transition text-slate-400 hover:text-white";
            });

            const inputLabel = document.getElementById('input-label');
            const formatContainer = document.getElementById('format-container');
            if (resetInput) resetUI();

            inputLabel.innerText = `Tempel Link ${platform.toUpperCase()}:`;
            if (platform === 'tiktok') formatContainer.classList.remove('hidden');
            else formatContainer.classList.add('hidden');
        }

        function resetUI() {
            document.getElementById('status-box').classList.add('hidden');
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('preview-box').classList.add('hidden');
        }

        function startDownload() {
            const url = document.getElementById('url-input').value.trim();
            const format = document.getElementById('format-select').value;
            if (!url) {
                showError("Link tidak boleh kosong!");
                showToast("Link kosong!", "error");
                return;
            }

            resetUI();
            document.getElementById('status-box').classList.remove('hidden');
            document.getElementById('download-btn').disabled = true;
            document.getElementById('btn-text').innerText = "Memproses...";

            socket.emit('start_download', { url, platform: currentPlatform, format });
        }

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            errBox.innerText = msg;
            errBox.classList.remove('hidden');
            document.getElementById('status-box').classList.add('hidden');
            document.getElementById('download-btn').disabled = false;
            document.getElementById('btn-text').innerText = "Unduh Sekarang";
        }

        // 3. Local History Management
        function saveToHistory(title, downloadUrl) {
            let history = JSON.parse(localStorage.getItem('download_history') || '[]');
            history.unshift({ title, downloadUrl, time: new Date().toLocaleTimeString() });
            if (history.length > 5) history.pop();
            localStorage.setItem('download_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('download_history') || '[]');
            if (history.length === 0) {
                list.innerHTML = `<p class="text-center italic text-slate-600">Belum ada riwayat unduhan.</p>`;
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="flex justify-between items-center bg-slate-950 p-1.5 rounded-lg border border-slate-800">
                    <span class="truncate max-w-[170px] text-slate-300">${item.title}</span>
                    <a href="${item.downloadUrl}" class="text-pink-400 hover:underline font-bold text-[10px]"><i class="fa-solid fa-download"></i></a>
                </div>
            `).join('');
        }

        function clearHistory() {
            localStorage.removeItem('download_history');
            loadHistory();
            showToast('Riwayat dibersihkan!');
        }

        socket.on('preview', (data) => {
            document.getElementById('preview-img').src = data.coverUrl;
            document.getElementById('preview-title').innerText = data.title;
            document.getElementById('preview-box').classList.remove('hidden');
        });

        socket.on('info', (msg) => {
            document.getElementById('status-title').innerText = msg;
        });

        // 4. Update Circular Progress Ring
        socket.on('progress', (data) => {
            const circle = document.getElementById('circular-progress');
            const circumference = 2 * Math.PI * 20; // r = 20
            const offset = circumference - (data.progress / 100) * circumference;
            circle.style.strokeDashoffset = offset;
            
            document.getElementById('progress-text').innerText = `${Math.round(data.progress)}%`;
            document.getElementById('speed-text').innerText = `${data.speedMBps} MB/s`;
            document.getElementById('eta-text').innerText = `ETA: ${data.etaSec}s`;
            if (data.title) document.getElementById('status-title').innerText = data.title;
        });

        socket.on('done', (data) => {
            document.getElementById('status-box').classList.add('hidden');
            const resBox = document.getElementById('result-box');
            const link = document.getElementById('download-link');
            link.href = data.downloadUrl;
            link.download = data.fileName;
            resBox.classList.remove('hidden');
            document.getElementById('download-btn').disabled = false;
            document.getElementById('btn-text').innerText = "Unduh Sekarang";
            showToast("File siap diunduh!");
            saveToHistory(data.title, data.downloadUrl);
        });

        socket.on('error', (errMsg) => {
            showError(errMsg);
            showToast(errMsg, "error");
        });

        socket.on('update_counter', (data) => {
            document.getElementById('total-downloads').innerText = data.totalDownloads;
        });

        window.onload = loadHistory;
    </script>
</body>
</html>
