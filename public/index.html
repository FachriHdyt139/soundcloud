<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader - SoundCloud & TikTok</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" alt="Profile" class="profile-pic">
                <span class="badge">PRO</span>
            </div>
            <h1>MEDIA DOWNLOADER</h1>
            <div class="stats">
                <i class="fa-solid fa-fire"></i> Total Unduhan: <span id="total-downloads">1256</span>
            </div>
        </header>

        <main>
            <div class="card">
                <!-- Pilihan Platform (Hanya SC dan TikTok) -->
                <div class="platform-tabs">
                    <button class="tab-btn active" data-platform="soundcloud">
                        <i class="fa-brands fa-soundcloud"></i> SC
                    </button>
                    <button class="tab-btn" data-platform="tiktok">
                        <i class="fa-brands fa-tiktok"></i> TikTok
                    </button>
                </div>

                <!-- Input Form -->
                <div class="input-group">
                    <label id="input-label" for="url-input">Tempel Link SOUNDCLOUD:</label>
                    <div class="input-wrapper">
                        <input type="text" id="url-input" placeholder="https://soundcloud.com/...">
                        <button id="paste-btn"><i class="fa-solid fa-paste"></i> Paste</button>
                    </div>
                </div>

                <!-- Tombol Eksekusi -->
                <button id="download-btn" class="action-btn">
                    <i class="fa-solid fa-rocket"></i> Unduh Sekarang
                </button>

                <!-- Status / Progress Box -->
                <div id="status-box" class="status-box hidden">
                    <div class="loader-spinner"></div>
                    <p id="status-text">Memproses...</p>
                    <div class="progress-bar-container hidden" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="download-info hidden" id="download-info">
                        <p>Kecepatan: <span id="speed">0.00</span> MB/s</p>
                        <p>ETA: <span id="eta">0s</span></p>
                    </div>
                </div>
            </div>

            <!-- Riwayat Unduhan Lokal -->
            <div class="history-card">
                <div class="history-header">
                    <h3><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Unduhan Lokal</h3>
                    <button id="clear-history">Hapus</button>
                </div>
                <div id="history-list" class="history-list">
                    <p class="empty-history">Belum ada riwayat unduhan.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
